---
name: Replace asset_uuid on PR

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  replace-uuid:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for tj-actions to diff properly

      - name: Get list of changed files
        id: changed
        uses: tj-actions/changed-files@v44

      - name: Check if common.yaml was changed
        if: contains(steps.changed.outputs.all_changed_files, 'common.yaml')
        run: echo "common.yaml was changed!"

      - name: Replace 'generate' with UUID if needed
        if: contains(steps.changed.outputs.all_changed_files, 'common.yaml')
        run: |
          sudo apt-get update && sudo apt-get install -y uuid-runtime
          FILE="common.yaml"
          if grep -q 'asset_uuid: generate' "$FILE"; then
            UUID=$(uuidgen)
            echo "Replacing with UUID: $UUID"
            sed -i "s/asset_uuid: generate/asset_uuid: $UUID/" "$FILE"
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git commit -am "Replace asset_uuid: generate with UUID"
            git push origin HEAD:${{ github.head_ref }}
          else
            echo "No 'generate' line found in common.yaml"
