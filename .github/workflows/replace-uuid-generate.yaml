---
name: Replace asset_uuid on PR



on:
  pull_request:
    types: [opened, synchronize]

jobs:
  replace-uuid:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    #if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for tj-actions to diff properly

      - name: Get list of changed files
        id: changed
        uses: tj-actions/changed-files@v44
        with:
          files: '**/common.yaml'

      - name: Replace 'generate' with UUID in common.yaml files
        if: steps.changed.outputs.all_changed_files != ''
        run: |
          for file in ${{ steps.changed.outputs.all_changed_files }}; do
            echo "Checking $file"
            if grep -q 'asset_uuid: generate' "$file"; then
              UUID=$(uuidgen)
              echo "Replacing in $file with UUID: $UUID"
              sed -i "s/asset_uuid: generate/asset_uuid: $UUID/" "$file"
            fi
          done

      - name: Commit and push changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
          else
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git commit -am "Replace asset_uuid: generate with UUID"
            git push origin HEAD:${{ github.head_ref }}
          fi
